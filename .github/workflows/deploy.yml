name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1️⃣ Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v3


      # 2️⃣ Login to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      # 3️⃣ Build Docker image
      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/sampleapp:latest .


      # 4️⃣ Push Docker image
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/sampleapp:latest


      # 5️⃣ Deploy to EC2 via SSH
      - name: Deploy to EC2 Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |

            echo "Pulling latest image..."
            docker pull ${{ secrets.DOCKER_USERNAME }}/sampleapp:latest

            echo "Stopping existing container..."
            docker stop webapp || true
            docker rm webapp || true

            echo "Cleaning unused containers..."
            docker container prune -f

            echo "Starting new container..."
            docker run -d \
              --name webapp \
              --restart always \
              -p 80:5000 \
              ${{ secrets.DOCKER_USERNAME }}/sampleapp:latest

            echo "Deployment complete."
